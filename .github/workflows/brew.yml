name: Brew

on:
  schedule:
    # 11:00 UTC ≈ 7am ET / 6am ET during DST. GitHub's scheduler drifts under
    # load, so treat this as "some time after 7", not "at 7".
    - cron: '0 11 * * *'
  workflow_dispatch: {}

# Only ever one brew in flight; a manual run supersedes a slow scheduled one.
concurrency:
  group: brew
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Brew today's issue
        run: python -m espresso brew

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain docs data/seen.json)" ]; then
            echo "Nothing changed; skipping commit."
            exit 0
          fi
          git config user.name  "espresso[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/seen.json
          git commit -m "brew: $(date -u +%Y-%m-%d)"
          git push
