# ═══════════════════════════════════════════════════════════════════════════
#  Daily Espresso — everything editable lives here.
# ═══════════════════════════════════════════════════════════════════════════

[masthead]
tagline = "Five things, no scrolling"
edition = "Vol. I"

# ─── Weather strip ─────────────────────────────────────────────────────────
# Open-Meteo. No key, no account. Add or remove places freely.

[[weather.place]]
code = "BOS"
latitude = 42.3601
longitude = -71.0589
timezone = "America/New_York"

[[weather.place]]
code = "PAR"
latitude = 48.8566
longitude = 2.3522
timezone = "Europe/Paris"

# ─── NHL panel ─────────────────────────────────────────────────────────────
# Team codes drive the head-to-head box. `home` is the team the panel is
# written from; `rival` is the other half of the matchup it looks for.

[nhl]
home = "BOS"
rival = "MTL"
label = "NHL — B's & Habs"

# ─── Rotating slot ─────────────────────────────────────────────────────────
# The dark panel. Change `label`, `countdown_*` and the entries whenever the
# obsession changes; set `enabled = false` to collapse the panel entirely.

[rotating]
enabled = true
label = "Currently Obsessed / GTA VI"
countdown_date = "2026-11-19"
countdown_caption = "DAYS TO 19 NOVEMBER"

[[rotating.entry]]
title = "The leak didn't move the date"
body = """
Rockstar ran its Netflix Extended Look on 27 August as planned, and 19 November \
still stands. Take-Two, meanwhile, has served DMCA subpoenas on Microsoft, Discord, \
X and Google chasing the handle CyberLeek."""

[[rotating.entry]]
title = "Someone is counter-programming launch day"
body = """
Devolver Digital has a mystery game dated 19 November. Pre-orders have been open \
since June: Standard $79.99, Ultimate $99.99, no special edition."""

# ─── Feeds ─────────────────────────────────────────────────────────────────
#   section  email_security | ai | france
#   weight   multiplier on the recency score; 1.0 is neutral
#   cap      optional per-source ceiling within its section
#   require  optional keywords — a general feed only contributes items that
#            mention one of these, which is how broad security feeds are
#            narrowed down to the email beat

[[source]]
name    = "Proofpoint"
url     = "https://www.proofpoint.com/us/rss.xml"
section = "email_security"
weight  = 1.2

[[source]]
name    = "KnowBe4"
url     = "https://blog.knowbe4.com/rss.xml"
section = "email_security"
weight  = 1.0
cap     = 1

[[source]]
