# ─── Tennis panel ──────────────────────────────────────────────────────────
# ESPN's public tennis API. No key. `follow` matches on display name with
# diacritics folded, so "Iga Swiatek" and "Iga Świątek" both work.

[tennis]
enabled = true
label = "Tennis — WTA & ATP"
follow = ["Iga Świątek", "Carlos Alcaraz"]
tours = ["wta", "atp"]
ranking_depth = 3
upcoming = 2

